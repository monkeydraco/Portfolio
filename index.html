<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        /* Base styles to center the text nicely on the page */
        body {
            font-family: 'Times New Roman', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Container styling for a clean card design */
        .portfolio-card {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            border-top: 5px solid #0070f3;
        }

        /* Typography styling */
        h1 {
            font-size: 2rem;
            margin: 0;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body>

    <!-- Main Content Container -->
    <div class="portfolio-card">
        <h1>Hello this is built for my portfolio building class</h1>
    </div>

</body>
</html>
